{% extends "base.html" %}
{% block title %}Восстановление пароля · HabitFlow{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Забыли пароль?</h1>
  <p class="muted">Введите email аккаунта. Мы отправим ссылку для установки нового пароля.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@example.com">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Отправить ссылку</button>
  </form>
  <p class="muted center"><a href="{{ url_for('login') }}">Вернуться ко входу</a></p>
</div>
{% endblock %}
