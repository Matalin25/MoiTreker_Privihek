{% extends "base.html" %}
{% block title %}Регистрация · HabitFlow{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Регистрация</h1>
  <p class="muted">Создайте аккаунт по email — это бесплатно и без лимитов.</p>
  <form method="post" class="form">
    <label>Email
      <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </label>
    <label>Пароль
      <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="минимум 6 символов">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
  </form>
  <p class="muted center">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
